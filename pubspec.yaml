name: photo_gallery_camera
description: Photo Gallery & Camera - Flutter Coursework App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.6
  dio: ^5.9.0
  go_router: ^16.0.0
  image_picker: ^1.2.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/